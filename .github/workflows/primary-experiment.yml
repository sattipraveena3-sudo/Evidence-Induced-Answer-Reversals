name: Primary Experiment

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI-compatible model name
        required: true
        default: gpt-4.1-mini
      limit:
        description: Number of questions
        required: true
        default: '100'
  push:
    branches: [main]
    paths:
      - 'scripts/prepare_hotpotqa.py'
      - '.github/workflows/primary-experiment.yml'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MODEL: ${{ inputs.model || 'gpt-4.1-mini' }}
      LIMIT: ${{ inputs.limit || '100' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify API secret exists
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo 'OPENAI_API_KEY repository secret is missing.'
            exit 1
          fi
      - run: python -m pip install -e '.[plots]'
      - name: Prepare official HotpotQA pilot set
        run: python scripts/prepare_hotpotqa.py --output data/primary.jsonl --limit "$LIMIT" --seed 7
      - name: Generate real Top-k trajectories
        run: |
          ear-run --input data/primary.jsonl --output results/primary_trajectories.jsonl --backend openai --model "$MODEL" --depths 1,2,3,5,10 --limit "$LIMIT"
      - name: Analyze EAR results
        run: ear-analyze --input results/primary_trajectories.jsonl --outdir results/primary --plots
      - name: Commit real primary results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f results/primary results/primary_trajectories.jsonl
          git commit -m 'Add real HotpotQA EAR pilot results' || exit 0
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: ear-primary-results
          path: results/
