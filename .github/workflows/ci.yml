name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest
      - run: pytest -q
      - name: Run deterministic smoke experiment
        run: |
          ear-run \
            --input data/sample.jsonl \
            --output /tmp/mock_trajectories.jsonl \
            --backend mock \
            --depths 1,2,3,5 \
            --gate lexical
          ear-analyze --input /tmp/mock_trajectories.jsonl --outdir /tmp/mock_results
          test -f /tmp/mock_results/summary.json
          test -f /tmp/mock_results/gate_summary.json
